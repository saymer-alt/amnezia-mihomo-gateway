name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - stable

permissions:
  contents: read

jobs:
  shell:
    name: Shell checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n uninstall.sh
          bash -n doctor.sh
          for script in scripts/*.sh; do
            sh -n "$script"
          done
          for test in tests/*.sh; do
            bash -n "$test"
          done
          for test in tests/live/*.sh; do
            bash -n "$test"
          done

      - name: ShellCheck errors
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck -S error install.sh uninstall.sh doctor.sh scripts/*.sh tests/*.sh tests/live/*.sh

      - name: Mihomo config patch regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-mihomo-config-patch.sh

      - name: Runtime config discovery fixtures
        shell: bash
        run: bash tests/test-runtime-discovery.sh

      - name: Read-only rp_filter diagnostic fixtures
        shell: bash
        run: bash tests/test-rp-filter-diagnostics.sh

      - name: Fail-secure lifecycle regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-fail-secure.sh

      - name: Installer reconcile regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-installer-reconcile.sh

      - name: Watchdog regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-watchdog.sh

      - name: Sysctl reinstall persistence regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-sysctl-persistence.sh

      - name: Ownership rollback regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-ownership-rollback.sh

      - name: Live acceptance kit fixture tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/live/test-kit.sh
